<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="" method="post">
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname" required><br><br>
        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname" required><br><br>
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required><br><br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required><br><br>
        <label for="male">Male</label>
        <input type="radio" id="male" name="gender" value="male" required><br><br>
        <label for="female">Female</label>
        <input type="radio" id="female" name="gender" value="female" required><br><br>
        <label for="course">Select Course</label>
        <select id="course" name="course" required>
            <option value="python">Python</option>
            <option value="webdev">Web Development</option>
            <option value="datasci">Data Science</option>
            <option value="ml">Machine Learning</option>
        </select><br><br>
        <label for="uploads">Upload File</label><br>
        <input type="file" id="uploads" name="uploads" required><br><br>
        <input type="submit" value="Register">
        </form>
</body>
</html>
