<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h1>List</h1>
    <h2>Ordered List</h2>
    <h1>List of Countries</h1>
    <ol>
        <li>Kenya</li>
        <li>Uganda</li>
        <li>Tanzania</li>
        <li>Somalia</li>
    </ol>
    <h1>Unordered List</h1> 
    <h2>List of Fruits</h2>
    <ul>
        <li>orange</li>
        <li>apple</li>
        <li>banana</li>
        <li>mango</li>
    </ul> 
    <h1>Description List</h1> 
    <dl>
        <dt>Apple</dt>
        <dd>A round fruit with red skin</dd>
        <dt>Banana</dt>
        <dd>A yellow fruit with crescent shape</dd>
    </dl> 
</body>
</html>
