<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="static/css/urembo.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <div class="login-container">
        <!--Left section-->
        <div class="social-section">
            <div class="logo">
               <img src="static/images/soc.med.ico" alt="H" class="logo-icon">
               <h2>TOP HTML</h2>
            </div>
            <p class="description">Login using social media to get quick access</p>
            <button class="social-button facebook">Sign in with Facebook</button>
            <button class="social-button twitter">Sign in with Twitter</button>
            <button class="social-button google">Sign in with Google</button>
        </div>
        <!--Right Section-->
        <div class="form-section">
            <h1>Login to your account</h1>
             <p class="signup">Don't have an account? <a href="#">Sign Up Free!</a></p>
             <form action="" method="post">
                <input type="email" placeholder="Email Address" aria-label="Email Address" required>
                <input type="password" placeholder="Password" aria-label="Password" required>
                <div class="form-options">
                   <label class="remember">
                    <input type="checkbox" name="remember">
                    <span>Remember me</span>
                   </label>
                   <a href="#" class="forgot">Forgot Password?</a>
                </div>
                <button type="submit" class="login-button">Login with email</button>
             </form>
        </div>
    </div>
</body>
</html>
